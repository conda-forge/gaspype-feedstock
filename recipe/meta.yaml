{% set name = "gaspype" %}
{% set version = "1.1.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 32ad30f69d7d486031696907ee76bb1d7ff6d6417802f2961f736d0cd9aa31c1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - setuptools >=64
    - setuptools-scm >=8
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy >2.0.0

test:
  imports:
    - gaspype
  requires:
    - python {{ python_min }}
    - pip
    - pytest
    - pandas # Required for running all tests
    - cantera # Required for running all tests
  source_files:
    - pyproject.toml
    - README.md
    - tests/*.py
  files:
    - tests/test_data/*.tsv
    - tests/test_data/*.csv
  commands:
    - pip check
    - rm tests/test_db_reader.py # Remove test that requires full repo
    - rm tests/test_doc_examples.py # Remove test that requires full repo
    - pytest

about:
  home: https://github.com/DLR-Institute-of-Future-Fuels/gaspype
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Performant library for thermodynamic calculations"

extra:
  recipe-maintainers:
    - Nonannet
